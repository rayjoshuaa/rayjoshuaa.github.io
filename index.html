:root{--wine:#682d40;--gold:#bc995b;--ink:#292b30;--muted:#77777d;--line:#e7e4df;--paper:#faf9f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:232px;background:#fff;border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column}.brand{font:700 25px Georgia,serif;letter-spacing:2px;color:var(--wine)}.brand small{display:block;font:10px system-ui;letter-spacing:2px;color:#888;margin-top:6px}.side-label{font-size:10px;letter-spacing:1.8px;color:#98958e;margin:44px 10px 12px}.years{display:grid;gap:5px}.year{background:none;border:0;text-align:left;padding:10px 13px;border-radius:7px;color:#68686e;display:flex;justify-content:space-between;align-items:center}.year.active{background:#f4ecef;color:var(--wine);font-weight:650}.dot{width:6px;height:6px;border-radius:50%;background:#c6a268}.aside-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;color:#8b8783;font-size:11px}.aside-bottom b{display:block;color:#66615f;font-weight:500}main{margin-left:232px;padding:28px 46px 60px;max-width:1650px}.top{display:flex;justify-content:space-between;align-items:center;color:#8a8681;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:23px}.top span{color:var(--wine)}.pill{border:1px solid #e4d8c3;border-radius:20px;padding:5px 12px;background:#fffaf0;color:#876a37;font-size:11px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:35px 0 28px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--wine);font-weight:700}h1{font:42px/1.2 Georgia,serif;margin:9px 0 10px;letter-spacing:-1px}p{margin:0;color:var(--muted)}.print{background:white;border:1px solid #ddd9d1;border-radius:7px;padding:9px 15px;color:#5b5550}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;text-align:left;position:relative;color:var(--ink);transition:.2s}.card.active{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine)}.card .num{font:12px system-ui;color:var(--muted)}.card h2{font:23px Georgia,serif;margin:12px 0 6px}.card p{font-size:12px;min-height:38px}.card .foot{display:flex;justify-content:space-between;font-size:11px;color:#938a7b;margin-top:22px}.card.active:after{content:'Selected';position:absolute;top:18px;right:18px;color:var(--wine);font-size:10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:34px 0 17px}.sectionhead h2{font:24px Georgia,serif;margin:0 0 4px}.sectionhead p{font-size:12px}.filters{display:flex;gap:8px}input,select{border:1px solid #e1ddd6;background:white;border-radius:6px;padding:9px 11px;color:#5a5652}input{width:210px}.tablewrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;text-align:left;min-width:680px}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:#8b857c;background:#f6f4ef;padding:13px 20px}td{padding:16px 20px;border-top:1px solid #eeece8;font-size:12px;vertical-align:middle}td:first-child{width:92px;font-weight:600}td:nth-child(2){width:118px;color:#89837b;font-size:11px}td:last-child{width:100px}.lesson{display:block;background:none;border:0;padding:0;text-align:left;color:#3e3b3c;font-size:12px;line-height:1.5}.lesson:hover{color:var(--wine);text-decoration:underline}.badge{font-size:9px;border-radius:4px;padding:4px 7px;white-space:nowrap;background:#f1eee7;color:#7e6a46}.badge.review{background:#eaf0f5;color:#5a7489}.badge.assessment{background:#f6eae4;color:#a56c4f}.badge.break{background:#eeeef0;color:#8c8c94}.badge.project{background:#e8f1eb;color:#567b62}.badge.ai{background:#f0eaf6;color:#84639f}.breakrow{background:#fbfaf8}.bottom{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:24px}.note{border:1px solid var(--line);border-radius:9px;padding:22px;background:white}.note h3{font:19px Georgia,serif;margin:0 0 9px}.note p{font-size:12px;line-height:1.8}.note.gold{background:#f4efe5;border-color:#e9dfcd}.empty{text-align:center;padding:90px 20px;border:1px dashed #d9d1c6;border-radius:10px;background:#fff}.empty h2{font:28px Georgia,serif}.empty p{max-width:440px;margin:auto}.empty button{margin-top:23px;background:var(--wine);color:white;border:0;border-radius:6px;padding:10px 18px}.count{font-size:11px;color:#999;margin:12px 0}.footer{display:flex;justify-content:space-between;font-size:10px;color:#a09a92;margin-top:30px}.dialog{border:1px solid var(--line);border-radius:12px;padding:30px;max-width:520px;width:90%;box-shadow:0 20px 100px #0003}.dialog::backdrop{background:#25202b66}.dialog h2{font:27px Georgia,serif;margin:10px 0 18px}.dialog p{margin-bottom:16px}.dialog .close{float:right;background:none;border:0;font-size:24px;color:#888}.dialog h3{font-size:12px;color:var(--wine)}@media(max-width:1000px){aside{width:180px;padding:25px 14px}main{margin-left:180px;padding:25px}.sectionhead{align-items:flex-start;gap:15px;flex-direction:column}.hero{gap:20px}h1{font-size:34px}.cards{gap:9px}.card{padding:15px}.card h2{font-size:20px}}@media(max-width:650px){aside{position:static;width:auto;padding:17px 20px;border-bottom:1px solid var(--line)}.brand small,.side-label,.aside-bottom{display:none}.brand{font-size:21px}.years{display:flex;overflow:auto;margin-top:14px}.year{white-space:nowrap;padding:7px 10px}.dot{display:none}main{margin:0;padding:20px}.hero{align-items:flex-start}.hero .print{font-size:11px;white-space:nowrap}h1{font-size:31px}.cards{grid-template-columns:1fr}.card p{min-height:0}.card .foot{margin-top:12px}.card h2{margin:7px 0}.bottom{grid-template-columns:1fr}.filters{width:100%}input{width:100%;min-width:0}.top{font-size:10px}}@media print{aside,.filters,.print,.top,.dialog{display:none}main{margin:0;padding:0}.cards{break-inside:avoid}table{min-width:0}td,th{padding:9px}.tablewrap{overflow:visible}.bottom{break-inside:avoid}body{background:#fff}.footer{margin-top:15px}}
</style></head><body><aside><div class="brand">SIAMIS<small>COMPUTING CLASS</small><span class="brand-sub">Lesson Plan</span></div><div class="side-label">YEAR LEVELS</div><nav class="years" aria-label="Year levels"></nav><div class="aside-bottom"><b>Academic Year 2026-2027</b>Siam International School</div></aside><main><div class="top"><div>Academic planning &nbsp; / &nbsp; <span id="crumb">Year 1</span></div></div><div class="hero"><div><div class="eyebrow">LESSON PLANS & MATERIALS</div><h1 id="heading">Year 1 Computing</h1></div><div class="hero-actions"><label for="subject" class="sr-only">Subject</label><select id="subject" onchange="selectSubject(this.value)"></select><button class="print" onclick="window.print()">↗ &nbsp; Print overview</button></div></div><div id="content"></div><div class="footer"><span>Siam International School · Computing</span><span>Annual curriculum · 2026–27</span></div></main><dialog class="dialog" id="detail"><button class="close" aria-label="Close lesson details" onclick="document.querySelector('dialog').close()">×</button><div class="eyebrow" id="detailmeta"></div><h2 id="detailtitle"></h2><div id="resourcecontent"></div></dialog><script src="curriculum.js"></script><script src="resources.js"></script><script>
const curriculum=window.CURRICULUM; let subject='Computing',terms=curriculum['1'].Computing.terms;
let year=1,term=0,query='',filter='all';const labels={teaching:'Learning',review:'Review',assessment:'Assessment',break:'Break',project:'Project',ai:'AI learning'};
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function course(){return curriculum[String(year)]?.[subject]}
function nav(){document.querySelector('.years').innerHTML=Array.from({length:11},(_,i)=>`<button class="year ${year===i+1?'active':''}" aria-pressed="${year===i+1}" onclick="selectYear(${i+1})">Year ${i+1}${i===0?'<span class="dot" aria-label="Annual topics approved"></span>':''}</button>`).join('')}
function selectYear(y){year=y;const subjects=Object.keys(curriculum[String(y)]||{});if(!subjects.includes(subject))subject=subjects[0]||'Computing';query='';filter='all';nav();syncHeading();render()}
function selectSubject(v){subject=v;query='';filter='all';syncHeading();render()}
function syncHeading(){const subjects=Object.keys(curriculum[String(year)]||{});document.querySelector('#heading').textContent=`Year ${year} ${subject}`;document.querySelector('#crumb').textContent=`Year ${year} · ${subject}`;const el=document.querySelector('#subject');el.innerHTML=subjects.map(v=>`<option value="${escape(v)}" ${v===subject?'selected':''}>${escape(v)}</option>`).join('');el.hidden=subjects.length<2;if(course())terms=course().terms}
function selectTerm(t){term=t;query='';filter='all';render()}
function render(){const c=document.querySelector('#content');if(!course()){c.innerHTML=`<div class="empty"><div class="eyebrow">YEAR LEVEL</div><h2>Year ${year} is awaiting planning.</h2><p>Year 9 topics will be planned when its textbook is available.</p><button onclick="selectYear(1)">View Year 1 topics</button></div>`;return}c.innerHTML=`<div class="cards">${terms.map((t,i)=>`<button class="card ${term===i?'active':''}" aria-pressed="${term===i}" onclick="selectTerm(${i})"><div class="num">TERM 0${i+1}</div><h2>${t.title}</h2><p>${t.focus}</p><div class="foot"><span>${t.date}</span><span>${t.weeks.length} weeks →</span></div></button>`).join('')}</div><div class="sectionhead"><div><h2>Weekly lesson plans</h2><p>Term ${term+1} · Select a topic to view its lesson plan PDF</p></div><div class="filters"><input aria-label="Search lessons" placeholder="Search a topic…" oninput="query=this.value;rows()"><select aria-label="Filter week type" onchange="filter=this.value;rows()"><option value="all">All weeks</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="tablewrap"><table><thead><tr><th>Week</th><th>Dates</th><th>Lesson 1 · ${course().days[0]}</th><th>Lesson 2 · ${course().days[1]}</th><th>Focus</th><th>Materials</th></tr></thead><tbody id="rows"></tbody></table></div><div class="count" id="count"></div><details class="scope-notes"><summary>Curriculum notes and source</summary><p>${escape(course().scope)}</p>${course().differentiation?`<p>${escape(course().differentiation)}</p>`:''}<p>Source: ${escape(course().source)}</p><p>Annual topic approval: ${escape(course().status)}. Detailed lesson PDFs and teaching materials are added separately. School events may affect individual lessons; consolidation time should be used for missed activities.</p></details>`;rows()}
function rows(){const ws=terms[term].weeks.map((w,i)=>({w,i})).filter(({w})=>(filter==='all'||(w[3]||'teaching')===filter)&&w.join(' ').toLowerCase().includes(query.toLowerCase()));document.querySelector('#rows').innerHTML=ws.length?ws.map(({w,i})=>`<tr class="${w[3]==='break'?'breakrow':''}"><td>Week ${String(i+1).padStart(2,'0')}</td><td>${w[0]}</td><td>${cell(w[1],i,1)}</td><td>${cell(w[2],i,2)}</td><td><span class="badge ${w[3]||''}">${labels[w[3]||'teaching']}</span></td><td>${w[3]==='break'?'—':`<button class="material-btn" onclick="materials(${i})">Materials <span>↗</span></button>`}</td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:40px;color:#888">No lessons match. Try another topic or filter.</td></tr>';document.querySelector('#count').textContent=`${ws.length} of ${terms[term].weeks.length} weeks shown · School calendar 2026–27`}
function cell(s,i,l){const r=resource(i);return /break|No lesson|Sports Day/.test(s)?`<span style="color:#999">${escape(s)}</span>`:`<button class="lesson" onclick="details(${i},${l})">${escape(s)}</button>${r.lessonPlan&&r.lessonPlan.url?`<a class="download-plan" href="${escape(r.lessonPlan.url)}" download="${escape(r.lessonPlan.name||'Lesson Plan.pdf')}">Download PDF ↓</a>`:'<span class="file-status">PDF not uploaded</span>'}`}
const resources=window.LESSON_RESOURCES||{};
function resource(i){const slug=subject.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'');return resources[`y${year}-${slug}-t${term+1}-w${i+1}`]||(subject==='Computing'?resources[`y${year}-t${term+1}-w${i+1}`]:null)||{}}
function link(r,label){if(!r||!r.url)return `<div class="resource-row"><div><strong>${label}</strong><small>Not uploaded yet</small></div><span class="unavailable">Unavailable</span></div>`;return `<div class="resource-row"><div><strong>${label}</strong><small>${escape(r.name||label)}</small></div><div class="resource-actions"><a href="${escape(r.url)}" target="_blank" rel="noopener">View ↗</a><a href="${escape(r.url)}" download="${escape(r.name||'')}">Download ↓</a></div></div>`}
function openResources(i,l){const w=terms[term].weeks[i],r=resource(i);document.querySelector('#detailmeta').textContent=`Year ${year} · ${subject} · Term ${term+1} · Week ${i+1}`;document.querySelector('#detailtitle').textContent=l?w[l]:`Week ${i+1} materials`;document.querySelector('#resourcecontent').innerHTML=l?link(r.lessonPlan,'Lesson plan PDF'):link(r.reference,'Lesson reference PDF')+link(r.presentation,'Presentation');document.querySelector('#detail').showModal()}
function details(i,l){const r=resource(i);if(r.lessonPlan&&r.lessonPlan.url){window.open(r.lessonPlan.url,'_blank','noopener');return}openResources(i,l)}
function materials(i){openResources(i)}
document.querySelector('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});nav();syncHeading();render();
</script></body></html>
