function course(){return curriculum[String(year)]?.[subject]}

function yearLabel(){return String(year)==='10-11'?'10–11':year}

function syncHeading(){const subjects=Object.keys(curriculum[String(year)]||{});document.querySelector('#heading').textContent=`Year ${yearLabel()} ${subject}`;document.querySelector('#crumb').textContent=`Year ${yearLabel()} · ${subject}`;const el=document.querySelector('#subject');el.innerHTML=subjects.map(v=>`<option value="${escape(v)}" ${v===subject?'selected':''}>${escape(v)}</option>`).join('');el.hidden=subjects.length<2;document.querySelector('label[for="subject"]').hidden=subjects.length<2;if(course())terms=course().terms}
function selectTerm(t){term=t;query='';filter='all';render()}
function render(){const c=document.querySelector('#content');if(!course()){c.innerHTML=`<div class="empty"><div class="eyebrow">YEAR LEVEL</div><h2>Year ${yearLabel()} is awaiting planning.</h2><p>Year 9 topics will be planned when its textbook is available.</p><button onclick="mainMenu()">Go back to main menu</button></div>`;return}c.innerHTML=`<div class="cards">${terms.map((t,i)=>`<button class="card ${term===i?'active':''}" aria-pressed="${term===i}" onclick="selectTerm(${i})"><div class="num">TERM 0${i+1}</div><h2>${t.title}</h2><p>${t.focus}</p><div class="foot"><span>${t.date}</span><span>${t.weeks.length} weeks ${icon('arrow')}</span></div></button>`).join('')}</div><div class="sectionhead"><div><h2>WEEKLY LESSON PLAN</h2></div><div class="filters"><input aria-label="Search lessons" placeholder="Search a topic…" oninput="query=this.value;rows()"><select title="Filter week type" aria-label="Filter week type" onchange="filter=this.value;rows()"><option value="all">All weeks</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="tablewrap"><table><thead><tr><th>Week</th><th>Dates</th><th>Lesson 1 · ${course().days[0]}</th><th>Lesson 2 · ${course().days[1]}</th><th>Focus</th><th>Materials</th></tr></thead><tbody id="rows"></tbody></table></div><div class="count" id="count"></div><details class="scope-notes"><summary>Curriculum notes and source</summary><p>${escape(course().scope)}</p>${course().differentiation?`<p>${escape(course().differentiation)}</p>`:''}<p>Source: ${escape(course().source)}</p><p>Lesson content and available files can be opened from each weekly row. School events may affect individual lessons; consolidation time should be used for missed activities.</p></details>`;rows()}
const schoolEvents={0:{10:[['Halloween','30 Oct 2026']],14:[['Loy Krathong','24 Nov 2026']],15:[['Christmas Event','4 Dec 2026']]},1:{5:[['Chinese New Year','5 Feb 2027']],13:[['Field Trip','30 Mar 2027'],['Songkran Festival','2 Apr 2027']]},2:{3:[['Coronation Day','4 May 2027']],5:[['Visakha Bucha Day','20 May 2027']],11:[['Sports Day','1 Jul 2027'],['Graduation Ceremony','2 Jul 2027']]}};
function eventDate(value){const [day,month,year]=value.split(' '),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],date=new Date(Date.UTC(Number(year),months.indexOf(month),Number(day))),weekday=new Intl.DateTimeFormat('en-GB',{weekday:'long',timeZone:'UTC'}).format(date);return `<time datetime="${date.toISOString().slice(0,10)}"><span class="event-weekday">${weekday}</span>${escape(value)}</time>`}
function rows(){let count=0;const output=terms[term].weeks.map((w,i)=>{const kind=w[3]||'teaching',events=schoolEvents[term]?.[i+1]||[];const match=(filter==='all'||kind===filter)&&w.join(' ').toLowerCase().includes(query.toLowerCase());let html='';if(match){count++;html=`<tr class="row-${kind}"><td>Week ${String(i+1).padStart(2,'0')}</td><td>${w[0]}</td><td>${cell(w[1],i,1,kind)}</td><td>${cell(w[2],i,2,kind)}</td><td><span class="badge ${kind}">${labels[kind]}</span></td><td>${(kind==='break'||(kind==='assessment'&&String(year)!=='1'))?'—':`<button class="material-btn" onclick="materials(${i})">Materials ${icon('folder')}</button>`}</td></tr>`}if(filter==='all'||filter==='event'){html+=events.filter(e=>(e.join(' ').toLowerCase().includes(query.toLowerCase())||query==='')).map(e=>`<tr class="row-event"><td>Event</td><td>${eventDate(e[1])}</td><td colspan="2"><span class="event-title">${icon('calendar')}${escape(e[0])}</span></td><td><span class="badge event">Event</span></td><td>—</td></tr>`).join('')}return html}).join('');document.querySelector('#rows').innerHTML=output||'<tr><td colspan="6" style="text-align:center;padding:40px;color:#888">No matching weeks or events.</td></tr>';document.querySelector('#count').textContent=`${count} of ${terms[term].weeks.length} weeks shown · School calendar 2026–27`}
function cell(s,i,l,kind){if(kind==='break')return '<span class="break-name">Midterm break</span>';const hasContent=String(year)==='1'&&window.LESSON_CONTENT?.[`y1-t${term+1}-w${i+1}`];if(kind==='assessment'&&!hasContent)return '<span class="assessment-name">Assessment week</span>';if(/break|No lesson|Sports Day|Visakha Bucha/.test(s))return `<span style="color:#777">${escape(s)}</span>`;return `<button class="lesson" onclick="details(${i},${l})">${escape(s)}</button>${hasContent?'<span class="lesson-hint">View lesson</span>':'<span class="file-status">Lesson not uploaded yet</span>'}`}
const resources=window.LESSON_RESOURCES||{};
function resource(i){const slug=subject.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'');return resources[`y${year}-${slug}-t${term+1}-w${i+1}`]||(String(year)==='10-11'?(resources[`y10-${slug}-t${term+1}-w${i+1}`]||resources[`y11-${slug}-t${term+1}-w${i+1}`]):null)||(subject==='Computing'?resources[`y${year}-t${term+1}-w${i+1}`]:null)||{}}
function link(r,label,i,docx=false){const fileIcon=label.includes('reference')?'book':label.includes('PPT')?'slides':'file',title=`<strong class="resource-title">${icon(fileIcon,'resource-file-icon')}${label}</strong>`;if(!r||!r.url)return `<div class="resource-row"><div>${title}<small>Not uploaded yet</small></div><span class="unavailable">Unavailable</span></div>`;return `<div class="resource-row"><div>${title}<small>${escape(r.name||label)}</small></div><div class="resource-actions">${docx?`<button onclick="showLesson(${i},0,true)">${icon('eye')}View</button>`:`<a href="${escape(r.url)}" target="_blank" rel="noopener">${icon('eye')}View</a>`}<a href="${escape(r.url)}" download="${escape(r.name||'')}">${icon('download')}Download</a></div></div>`}
function modalHeading(i,title,isLesson){const dialog=document.querySelector('#detail');dialog.classList.toggle('lesson-dialog',!!isLesson);document.querySelector('#detailmeta').textContent=`Year ${yearLabel()} · ${subject} · Term ${term+1} · Week ${i+1}`;document.querySelector('#detailtitle').textContent=title;return dialog}
function openResources(i,l){if(l){showLesson(i,l);return}const r=resource(i),dialog=modalHeading(i,`Week ${i+1} materials`,false);document.querySelector('#resourcecontent').innerHTML=link(r.lessonPlanDocx,'Lesson plan · DOCX',i,true)+link(r.lessonPlan,'Lesson plan · PDF',i)+link(r.presentation,'Presentation · PPT',i)+link(r.reference,'Lesson reference · PDF',i);if(!dialog.open){lockBackground();dialog.showModal()}dialog.scrollTop=0}
function showLesson(i,l=0,back=false){const w=terms[term].weeks[i],plan=String(year)==='1'&&subject==='Computing'?window.LESSON_CONTENT?.[`y1-t${term+1}-w${i+1}`]:null,dialog=modalHeading(i,l?w[l]:`Week ${i+1} lesson plan`,true);if(!plan){document.querySelector('#resourcecontent').innerHTML='<p>This lesson content has not been uploaded yet.</p>'+link(resource(i).lessonPlan,'Lesson plan PDF',i)}else{const selected=l?[{lesson:plan.lessons[l-1],number:l}]:plan.lessons.map((lesson,j)=>({lesson,number:j+1}));document.querySelector('#resourcecontent').innerHTML=`<article class="plan-content"><img class="lesson-banner" src="assets/school-header.png" alt="Siam International School"><h3>Lesson overview</h3><p>${escape(plan.overview)}</p>${selected.map(({lesson,number})=>`<section class="lesson-section"><h3>Lesson ${number} · ${escape(w[number])}</h3><p class="lesson-date">${escape(lesson.date)}</p><h3>Learning objective</h3><p>${escape(lesson.objective)}</p>${lesson.holiday?'':`<h3>The lesson flow</h3>${lesson.flow.map(f=>`<p><strong>${escape(f.label)}</strong> ${escape(f.text)}</p>`).join('')}<h3>Differentiation</h3>${lesson.differentiation.map(f=>`<p><strong>${escape(f.label)}</strong> ${escape(f.text)}</p>`).join('')}`}</section>`).join('')}<h3>End-of-week assessment/check</h3><p>${escape(plan.assessment)}</p><h3>Materials needed for the week</h3><ul>${plan.materials.map(m=>`<li>${escape(m)}</li>`).join('')}</ul><h3>End-of-week reflection</h3><ul><li>What worked well?</li><li>What flopped or confused students?</li><li>What needs to be re-taught or adjusted next week?</li></ul></article><button class="back-materials" onclick="materials(${i})">${icon('folder')}${back?'Back to materials':'View materials and downloads'}</button>`}if(!dialog.open){lockBackground();dialog.showModal()}dialog.scrollTop=0}
function details(i,l){showLesson(i,l)}
function materials(i){openResources(i)}
let pageScrollY=0;
function lockBackground(){pageScrollY=window.scrollY;document.documentElement.classList.add('modal-open');document.body.classList.add('modal-open');document.body.style.position='fixed';document.body.style.top=`-${pageScrollY}px`;document.body.style.width='100%'}
function unlockBackground(){document.documentElement.classList.remove('modal-open');document.body.classList.remove('modal-open');document.body.style.position='';document.body.style.top='';document.body.style.width='';window.scrollTo(0,pageScrollY)}
document.querySelector('#detail').addEventListener('close',unlockBackground);
document.querySelector('.print-icon').innerHTML=icon('print');document.querySelector('.close-icon').innerHTML=icon('close');
document.querySelector('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});nav();syncHeading();render();
</script></body></html>
